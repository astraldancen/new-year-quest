<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Квест: Подарок</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212; color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
            background-image: radial-gradient(circle at center, #2a2a2a 0%, #121212 100%);
        }
        .container {
            background: rgba(30, 30, 30, 0.95); padding: 30px 20px;
            border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            text-align: center; max-width: 500px; width: 100%;
            border: 1px solid #333;
        }
        h1 { color: #ff4d4d; margin-top: 0; font-size: 24px; }
        p { font-size: 16px; line-height: 1.5; color: #cccccc; margin-bottom: 25px; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; }
        .btn {
            padding: 18px 15px; font-size: 16px; font-weight: bold; border-radius: 12px;
            border: none; cursor: pointer; text-decoration: none; transition: 0.2s;
            display: block; width: 100%; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-presentation { background-color: #4CAF50; color: white; }
        .btn-camera { background-color: #2196F3; color: white; }
        .btn-unlocked { background-color: #ff9800; color: white; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.7); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(255, 152, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
        }

        .popup-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center;
            z-index: 1000; padding: 20px; box-sizing: border-box;
        }
        .popup-content {
            background: #2a2a2a; padding: 30px 20px; border-radius: 15px;
            border: 2px solid #ff4d4d; text-align: center; max-width: 350px; width: 100%;
            animation: popIn 0.3s ease;
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .popup-content h2 { color: #ff4d4d; margin-top: 0; font-size: 22px;}
        .popup-content p { color: white; margin-bottom: 20px; }
        .popup-btn-group { display: flex; gap: 10px; }
        .popup-btn-yes { background-color: #4CAF50; color: white; padding: 12px; border-radius: 8px; border: none; font-weight: bold; flex: 1; cursor: pointer; font-size: 16px; }
        .popup-btn-no { background-color: #f44336; color: white; padding: 12px; border-radius: 8px; border: none; font-weight: bold; flex: 1; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="ui-title"></h1>
    <p id="ui-description"></p>

    <div class="btn-group">
        <a id="btn-presentation" class="btn btn-presentation" href="#" target="_blank"></a>
        <a id="btn-camera" class="btn btn-camera" href="#"></a>
    </div>
</div>

<!-- Окно 1 -->
<div id="popup1" class="popup-overlay">
    <div class="popup-content">
        <h2>Погоди-ка...</h2>
        <p>прям точно хочешь??</p>
        <div class="popup-btn-group">
            <button class="popup-btn-no" onclick="closePopup(1)">Нет</button>
            <button class="popup-btn-yes" onclick="nextPopup(1, 2)">Да, уверен</button>
        </div>
    </div>
</div>

<!-- Окно 2 -->
<div id="popup2" class="popup-overlay">
    <div class="popup-content">
        <h2>Серьезно?</h2>
        <p>уверен???</p>
        <div class="popup-btn-group">
            <button class="popup-btn-no" onclick="closePopup(2)">Нет</button>
            <button class="popup-btn-yes" onclick="nextPopup(2, 3)">Да, уверен</button>
        </div>
    </div>
</div>

<!-- Окно 3 -->
<div id="popup3" class="popup-overlay">
    <div class="popup-content">
        <h2>Точно-точно?</h2>
        <p>Ну ладно, твой выбор...</p>
        <div class="popup-btn-group">
            <button class="popup-btn-no" onclick="closePopup(3)">Нет, пойду читать</button>
            <button class="popup-btn-yes" onclick="trollRedirect()">Да, открывай</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // ⚠️ --- ТВОИ НАСТРОЙКИ (МЕНЯЙ ЗДЕСЬ) --- ⚠️
    // ==========================================
    const SETTINGS = {
        // 1. ССЫЛКИ (вставь свои)
        presentationUrl: "https://vkvideo.ru/video-243302024_456239017?list=ln-DyelnaYWxOMz6BeL1j", // Ссылка на видео
        cameraUrl: "https://www.avito.ru/krasnoyarsk/fototehnika/sony_nex_5r_probeg_3640_8305225545",     // Ссылка на Авито

        // 2. ТЕКСТЫ (пиши свои)
        titleText: "Привет Дед Мороз и Снегурочка",
        descriptionText: "Выбирай, куда хочешь перейти.",
        btnPresentationText: "📖 Открыть презентацию",
        btnCameraText: "🔗 Перейти к камере", 
        btnCameraUnlockedText: "🔥 ОТКРЫТЬ КАМЕРУ НА АВИТО 🔥",
        unlockText: "Ого, ты вернулся",
    };
    // ==========================================

    // Встроенные звуки (не требуют файлов)
    function playSound(type) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'click') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'error') {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'success') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.25);
            }
        } catch (e) { console.log("Звук не работает"); }
    }

    // Инициализация текстов и ссылок
    document.getElementById('ui-title').innerText = SETTINGS.titleText;
    document.getElementById('ui-description').innerText = SETTINGS.descriptionText;
    
    const btnPres = document.getElementById('btn-presentation');
    btnPres.innerText = SETTINGS.btnPresentationText;
    btnPres.href = SETTINGS.presentationUrl;
    btnPres.addEventListener('click', () => { playSound('click'); });

    const btnCam = document.getElementById('btn-camera');
    btnCam.innerText = SETTINGS.btnCameraText;

    let isUnlocked = false;

    // Логика кнопки камеры
    btnCam.addEventListener('click', function(event) {
        if (!isUnlocked) {
            event.preventDefault(); // Блокируем переход
            playSound('error');     // Звук ошибки
            document.getElementById('popup1').style.display = 'flex'; // Показываем 1 окно
        }
    });

    function closePopup(id) {
        document.getElementById('popup' + id).style.display = 'none';
    }

    function nextPopup(current, next) {
        document.getElementById('popup' + current).style.display = 'none';
        document.getElementById('popup' + next).style.display = 'flex';
        playSound('click');
    }

    // ТРОЛЛИНГ: Нажали "Да" в 3-м окне, летим на презентацию!
    function trollRedirect() {
        document.getElementById('popup3').style.display = 'none';
        playSound('error');
        window.open(SETTINGS.presentationUrl, '_blank');
        unlockCamera();
    }

    // Разблокировка
    function unlockCamera() {
        if (!isUnlocked) {
            isUnlocked = true;
            btnCam.innerText = SETTINGS.btnCameraUnlockedText;
            btnCam.classList.remove('btn-camera');
            btnCam.classList.add('btn-unlocked');
            btnCam.href = SETTINGS.cameraUrl; 
            document.getElementById('ui-description').innerText = SETTINGS.unlockText;
            playSound('success');
        }
    }

    // Если человек сам вернулся с презентации (переключил вкладку), тоже разблокируем
    window.addEventListener('blur', function() {
        if (!isUnlocked) {
            unlockCamera();
        }
    });
</script>

</body>
</html>
